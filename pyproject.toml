[project]
name = "movilidad-teide-ahorro-energetico-innovae-2026-dev"
version = "0.1.0"
description = "Cálculo reproducible del ahorro de energía final de la movilidad del Teide."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
]
